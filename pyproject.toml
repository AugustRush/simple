[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple"
version = "0.1.0"
description = "Personal AI agent package with a memory palace and provider abstraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "openai",
  "typer",
  "rich",
  "mcp",
  "prompt_toolkit",
]

[project.optional-dependencies]
# pip install simple[feishu]  /  uv sync --extra feishu
feishu = ["lark-oapi"]
# pip install simple[web]  /  uv sync --extra web
web = ["starlette", "uvicorn"]
# The browser-level tests (tests/test_web_ui_e2e.py) drive the real page in Chromium.
# Deliberately not in the core: the download is ~100MB and the rest of the suite drives
# protocols, so an install that only wants the agent should not pay for it.  Skipped,
# not silently passed, when absent -- see that module's docstring.
#   uv pip install --python .venv/bin/python --extra e2e .
#   .venv/bin/python -m playwright install chromium
e2e = ["playwright"]

[project.scripts]
simple = "agent.cli:app"

[dependency-groups]
dev = [
  "pytest",
  "lark-oapi",   # needed by tests/test_feishu_channel.py
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = [
  "_builtin/skills/**/*.md",
  "_builtin/skills/**/*.py",
  "_builtin/plugins/**/*.json",
  "_builtin/plugins/**/*.py",
  "_builtin/web/*.html",
  "_builtin/web/dist/**/*",
]
